name: Windows release
run-name: Photo Review ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        default: v1.3.2
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Validate release version
        run: python tools/release_windows.py --tag "$env:RELEASE_TAG" --validate
      - name: Validate signing settings
        if: vars.SIGNPATH_ENABLED == 'true'
        id: signing_settings
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Signing is enabled but $name is missing."
            }
          }
          $version = python -c "from photo_review.version import VERSION; print('.'.join((VERSION.split('.') + ['0'] * 4)[:4]))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine the signing version.' }
          "windows_version=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test generated-data workflows
        run: python -m unittest tests.test_updates tests.test_self_update tests.test_release tests.test_core tests.test_heic tests.test_phones tests.test_phone_import tests.test_phone_download tests.test_phone_cleanup tests.test_phone_folders tests.test_usb_import tests.test_packaging tests.test_gpu.FallbackTests -q
      - name: Build single Windows EXE
        run: python tools/build_windows.py --msvc=latest
      - name: Test packaged app with generated photos
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\PhotoReview.exe -ArgumentList @('--smoke-test', "$env:GITHUB_WORKSPACE\artifacts\release-smoke.json") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          $report = Get-Content artifacts/release-smoke.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged smoke report did not pass' }
      - name: Test portable update helper
        run: python tools/test_portable_update.py dist/PhotoReview.exe --report artifacts/portable-update-smoke.json
      - name: Upload unsigned EXE for signing
        if: vars.SIGNPATH_ENABLED == 'true'
        id: unsigned_exe
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: photoreview-unsigned-${{ env.RELEASE_TAG }}
          path: dist/PhotoReview.exe
          if-no-files-found: error
          retention-days: 7
      - name: Request SignPath signing and wait for approval
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned_exe.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: .build/signed
          parameters: |
            version: ${{ toJSON(steps.signing_settings.outputs.windows_version) }}
      - name: Verify and stage signed EXE
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.signing_settings.outputs.windows_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/verify_signed_release.ps1 -Path .build/signed/PhotoReview.exe -ExpectedVersion $env:EXPECTED_VERSION
          Copy-Item -LiteralPath .build/signed/PhotoReview.exe -Destination dist/PhotoReview.exe -Force
      - name: Save tested EXE for release recovery
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: photoreview-tested-${{ env.RELEASE_TAG }}
          path: dist/PhotoReview.exe
          if-no-files-found: error
          retention-days: 7
      - name: Load publisher from the workflow revision
        env:
          PUBLISHER_REVISION: ${{ github.workflow_sha }}
        run: |
          @'
          import os,subprocess
          from pathlib import Path
          revision=os.environ['PUBLISHER_REVISION']
          publisher=subprocess.check_output(['git','show',revision+':tools/release_windows.py'])
          Path('tools/release_windows.py').write_bytes(publisher)
          '@ | python -
      - name: Publish tested release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release_windows.py --tag "$env:RELEASE_TAG"
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-diagnostics
          path: |
            artifacts/nuitka-build-report.xml
            artifacts/release-smoke.json
            artifacts/release-smoke.png
            artifacts/portable-update-smoke.json
          if-no-files-found: ignore
